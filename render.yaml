services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (Node.js API)
  # ---------------------------------------------------------------------------
  - type: web
    name: learnsync-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prisma/learnsync.db
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "*"

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: learnsync-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: learnsync-backend
          property: host
