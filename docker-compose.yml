version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=file:./prisma/learnsync.db
      - JWT_SECRET=learnsync-demo-secret-change-in-prod
      - PORT=3001
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend/prisma:/app/prisma
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
